name: AL-AI-Assistant CI



on:

    push:
        branches:
            - main

    pull_request:
        branches:
            - main



jobs:

    test:

        runs-on: ubuntu-latest


        permissions:
          contents: read
          packages: write


        steps:


            - name: Checkout code
              uses: actions/checkout@v4



            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.13"



            - name: Install dependencies
              run: |
                pip install -r requirements.txt



            - name: Run tests
              run: |
                pytest


            
            - name: Login GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}



            - name: Login ACR
              uses: docker/login-action@v3
              with:
                registry: crpi-npa4w6l8amsghlzs.cn-hangzhou.personal.cr.aliyuncs.com
                username: ${{ secrets.ACR_USERNAME }}
                password: ${{ secrets.ACR_PASSWORD }}



            - name: Build Docker images
              run: |
                docker build \
                  -t ghcr.io/${{ github.repository_owner }}/al-ai-assistant:latest \
                  -t crpi-npa4w6l8amsghlzs.cn-hangzhou.personal.cr.aliyuncs.com/smzhiman/al-ai-assistant:latest \
                  .



            - name: Push GHCR
              run: |
                docker push \
                  ghcr.io/${{ github.repository_owner }}/al-ai-assistant:latest



            - name: Push ACR
              run: |
                docker push \
                crpi-npa4w6l8amsghlzs.cn-hangzhou.personal.cr.aliyuncs.com/smzhiman/al-ai-assistant:latest


    deploy:

        needs: test

        runs-on: ubuntu-latest

        steps:


            - name: Deploy ECS
              uses: appleboy/ssh-action@v1.2.0
              with:
                host: ${{ secrets.ECS_HOST }}
                username: ${{ secrets.ECS_USER }}
                key: ${{ secrets.ECS_SSH_KEY }}
                script: |
                  cd ~/apps/al-ai-assistant
                  sudo docker compose pull
                  sudo docker compose up -d
                  